{% extends "base.html" %}

{% block title %}Edit Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit your profile</h1>
            <p class="auth-subtitle">Update your name and email address</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('profile_edit') }}">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name"
                           class="form-input" value="{{ name or '' }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" value="{{ email or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="preferred_currency">Preferred currency</label>
                    <select id="preferred_currency" name="preferred_currency" class="form-input" required>
                        <option value="" disabled {% if not preferred_currency %}selected{% endif %}>Select a currency</option>
                        {% for c in currencies %}
                        <option value="{{ c }}" {% if preferred_currency == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to profile</a>
        </p>

    </div>
</section>

{% endblock %}
