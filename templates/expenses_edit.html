{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Edit Expense</h1>
      <p class="auth-subtitle">Update this expense</p>
    </div>
    <div class="auth-card">
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ url_for('edit_expense', id=expense['id']) }}">
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" class="form-input"
                 step="0.01" min="0.01" value="{{ amount or '' }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" class="form-input" required>
            <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
            {% for c in categories %}
            <option value="{{ c }}" {% if category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="currency">Currency</label>
          <select id="currency" name="currency" class="form-input" required>
            <option value="" disabled {% if not currency %}selected{% endif %}>Select a currency</option>
            {% for c in currencies %}
            <option value="{{ c }}" {% if currency == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" class="form-input"
                 value="{{ date or '' }}" required>
        </div>
        <div class="form-group">
          <label for="description">Description (optional)</label>
          <input type="text" id="description" name="description" class="form-input"
                 value="{{ description or '' }}">
        </div>
        <button type="submit" class="btn-submit">Save Changes</button>
      </form>
    </div>
    <p class="auth-switch"><a href="{{ url_for('profile') }}">Back to profile</a></p>
  </div>
</section>
{% endblock %}
